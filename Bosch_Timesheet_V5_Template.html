<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V5</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:20px;background:#f4f6f9}.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}.stats{display:flex;gap:10px}.stat{flex:1;padding:15px;border-radius:8px;color:#fff;font-weight:bold}.blue{background:#2d6cdf}.orange{background:#f59e0b}.green{background:#10b981}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:center}th{position:sticky;top:0;background:#e9eef7}input[type=number]{width:80px;padding:6px}button,select{padding:8px 12px;margin:3px}</style></head><body><div class="card"><h1>Bosch Timesheet V5</h1><div id="period"></div><button onclick="newPeriod()">New Period</button><button onclick="deletePeriod()">Delete Period</button><select id="history"></select></div><div class="stats"><div class="stat blue">Regular<br><span id="reg">0</span></div><div class="stat orange">OT<br><span id="ot">0</span></div><div class="stat green">Total<br><span id="tot">0</span></div></div><table><thead><tr><th>Date</th><th>Day</th><th>Hours</th><th>Reg</th><th>OT</th></tr></thead><tbody id="body"></tbody></table><script>function makePeriod(){const b=document.getElementById('body');b.innerHTML='';let d=new Date();let start=new Date(d.getFullYear(),d.getMonth(),21);if(d.getDate()<21)start=new Date(d.getFullYear(),d.getMonth()-1,21);let end=new Date(start.getFullYear(),start.getMonth()+1,20);document.getElementById('period').textContent='Pay Period: '+start.toISOString().slice(0,10)+' to '+end.toISOString().slice(0,10);for(let x=new Date(start);x<=end;x.setDate(x.getDate()+1)){let tr=document.createElement('tr');tr.innerHTML='<td>'+x.toISOString().slice(0,10)+'</td><td>'+x.toLocaleDateString(undefined,{weekday:'short'})+'</td><td><input type=number min=0 step=0.5 value=0 onchange=calc()></td><td class=r>0</td><td class=o>0</td>';b.appendChild(tr);}calc();}function calc(){let total=0;document.querySelectorAll('tbody tr').forEach(r=>{let h=+r.querySelector('input').value||0;r.querySelector('.r').textContent=h.toFixed(1);r.querySelector('.o').textContent='0.0';total+=h;});document.getElementById('reg').textContent=total.toFixed(1);document.getElementById('ot').textContent='Keep V4 OT Logic';document.getElementById('tot').textContent=total.toFixed(1);}function newPeriod(){alert('Create next pay period');}function deletePeriod(){if(confirm('Delete selected pay period?')) alert('Period deleted');}makePeriod();</script></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V7 Foundation</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f9}.toolbar,.cards{display:flex;gap:10px;flex-wrap:wrap}.card{flex:1;min-width:150px;padding:12px;color:#fff;border-radius:10px;font-weight:bold}.c1{background:#2563eb}.c2{background:#f59e0b}.c3{background:#10b981}.c4{background:#7c3aed}.c5{background:#dc2626}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:6px}input,select,textarea,button{padding:6px}.notes{width:100%;height:100px}@media print{.toolbar,button{display:none}}</style></head><body><h1>Bosch Timesheet V7 Foundation</h1><div id="periodLabel"></div><div class="toolbar"><button onclick="newPeriod()">New Period</button><button onclick="deletePeriod()">Delete Period</button><select id="periods"></select></div><div class="cards"><div class="card c1">Regular<br><span id=rh>0</span></div><div class="card c2">OT<br><span id=oh>0</span></div><div class="card c3">Total<br><span id=th>0</span></div><div class="card c4">LOA<br><span id=lh>0</span></div><div class="card c5">Night Count<br><span id=nh>0</span></div></div><table><thead><tr><th>Date</th><th>Start</th><th>End</th><th>Hours</th><th>Location</th><th>Nights</th><th>LOA</th></tr></thead><tbody id=tb></tbody></table><h3>Notes</h3><textarea id=notes class=notes></textarea><script>const KEY='boschV7Foundation';let db=JSON.parse(localStorage.getItem(KEY)||'{"periods":{},"current":""}');function save(){localStorage.setItem(KEY,JSON.stringify(db));}function fmt(d){return d.toISOString().slice(0,10)}function startPeriod(){let d=new Date();return d.getDate()>=21?new Date(d.getFullYear(),d.getMonth(),21):new Date(d.getFullYear(),d.getMonth()-1,21)}function pid(s){let e=new Date(s.getFullYear(),s.getMonth()+1,20);return s.toDateString()+' - '+e.toDateString()}function ensure(){if(!db.current){let s=startPeriod();let id=pid(s);db.current=id;db.periods[id]={days:{},notes:''};save();}}function refreshPeriods(){periods.innerHTML='';Object.keys(db.periods).forEach(p=>{let o=document.createElement('option');o.text=p;o.value=p;periods.add(o)});periods.value=db.current;}function loadPeriod(){let p=db.periods[db.current];periodLabel.textContent=db.current;notes.value=p.notes||'';tb.innerHTML='';let start=new Date(db.current.split(' - ')[0]);let end=new Date(start.getFullYear(),start.getMonth()+1,20);for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1){ } }function render(){let p=db.periods[db.current];tb.innerHTML='';let start=new Date(db.current.split(' - ')[0]);let end=new Date(start.getFullYear(),start.getMonth()+1,20);for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){let ds=fmt(new Date(d));let rec=p.days[ds]||{};let tr=document.createElement('tr');tr.innerHTML=`<td>${ds}</td><td><input type=time value='${rec.st||''}' onchange="upd('${ds}','st',this.value)"></td><td><input type=time value='${rec.en||''}' onchange="upd('${ds}','en',this.value)"></td><td id='h_${ds}'>0</td><td><input value='${rec.loc||''}' onchange="upd('${ds}','loc',this.value)"></td><td><select onchange="upd('${ds}','night',this.value)"><option ${rec.night!='Yes'?'selected':''}>No</option><option ${rec.night=='Yes'?'selected':''}>Yes</option></select></td><td><input type=number value='${rec.loa||0}' onchange="upd('${ds}','loa',this.value)"></td>`;tb.appendChild(tr);}calc();}function upd(ds,k,v){db.periods[db.current].days[ds]=db.periods[db.current].days[ds]||{};db.periods[db.current].days[ds][k]=v;save();calc();}function calc(){let total=0,loa=0,nights=0;Object.entries(db.periods[db.current].days).forEach(([ds,r])=>{let h=0;if(r.st&&r.en){h=(new Date('2000-01-01T'+r.en)-new Date('2000-01-01T'+r.st))/3600000;if(h<0)h=0;}let cell=document.getElementById('h_'+ds);if(cell)cell.textContent=h.toFixed(1);total+=h;loa+=Number(r.loa||0);if(r.night==='Yes')nights++;});th.textContent=total.toFixed(1);rh.textContent=total.toFixed(1);oh.textContent='0.0';lh.textContent=loa.toFixed(0);nh.textContent=nights;}notes.oninput=()=>{db.periods[db.current].notes=notes.value;save();};periods.onchange=()=>{db.current=periods.value;save();render();};function newPeriod(){let s=new Date();s.setMonth(s.getMonth()+1);let id=pid(new Date(s.getFullYear(),s.getMonth(),21));if(!db.periods[id])db.periods[id]={days:{},notes:''};db.current=id;save();refreshPeriods();render();}function deletePeriod(){if(confirm('Delete period?')){delete db.periods[db.current];let ks=Object.keys(db.periods);if(!ks.length){ensure()}else db.current=ks[0];save();refreshPeriods();render();}}ensure();refreshPeriods();render();</script></body></html>

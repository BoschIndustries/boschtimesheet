<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V6</title><style>body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px;max-width:1400px;margin:auto}h1{margin:0}.toolbar,.cards{display:flex;gap:10px;flex-wrap:wrap}.panel{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}.card{flex:1;min-width:180px;color:#fff;padding:15px;border-radius:10px;font-weight:bold}.b{background:#2563eb}.o{background:#f59e0b}.g{background:#10b981}.p{background:#7c3aed}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#e5e7eb;position:sticky;top:0}input,select,button,textarea{padding:6px}textarea{width:100%;height:90px}button{cursor:pointer}.small{width:70px}@media print{button,input[type=file],select{display:none}}</style></head><body><div class="panel"><h1>Bosch Timesheet V6</h1><div id="period"></div><div class="toolbar"><button onclick="newPeriod()">New Period</button><button onclick="deletePeriod()">Delete Period</button><button onclick="exportData()">Export</button><input type=file id=f onchange='importData(event)'><select id=history onchange='loadPeriod(this.value)'></select></div></div><div class='cards'><div class='card b'>Regular<br><span id=reg>0</span></div><div class='card o'>OT<br><span id=ot>0</span></div><div class='card g'>Total<br><span id=total>0</span></div><div class='card p'>LOA Total<br><span id=loat>0</span></div></div><table><thead><tr><th>Date</th><th>Day</th><th>Start</th><th>End</th><th>Hours</th><th>Location</th><th>Nights</th><th>LOA</th><th>Reg</th><th>OT</th></tr></thead><tbody id=tb></tbody></table><div class='panel'><h3>Weekly Summary</h3><div id=weeks></div></div><div class='panel'><h3>Notes / Reimbursements</h3><textarea id=notes></textarea></div><script>const KEY='boschV6';let db=JSON.parse(localStorage.getItem(KEY)||'{"periods":[],"days":{}}');function save(){localStorage.setItem(KEY,JSON.stringify(db))}function fmt(d){return d.toISOString().slice(0,10)}function ensure(){let n=new Date();let s=n.getDate()>=21?new Date(n.getFullYear(),n.getMonth(),21):new Date(n.getFullYear(),n.getMonth()-1,21);s=fmt(s);if(!db.periods.includes(s)){db.periods.push(s);save();}}function refresh(){let h=document.getElementById('history');h.innerHTML='';db.periods.slice().reverse().forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;h.appendChild(o)});if(h.options.length)loadPeriod(h.options[0].value)}function newPeriod(){let last=db.periods.sort().slice(-1)[0];let d=new Date(last);d.setMonth(d.getMonth()+1);d.setDate(21);db.periods.push(fmt(d));save();refresh();}function deletePeriod(){let p=history.value;if(!p)return;if(confirm('Delete '+p+'?')){db.periods=db.periods.filter(x=>x!==p);save();refresh();}}function loadPeriod(start){history.value=start;let s=new Date(start),e=new Date(s.getFullYear(),s.getMonth()+1,20);period.innerText='Pay Period: '+start+' to '+fmt(e);tb.innerHTML='';for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){let ds=fmt(new Date(d));let r=db.days[ds]||{};tb.innerHTML+=`<tr><td>${ds}</td><td>${new Date(ds).toLocaleDateString(undefined,{weekday:'short'})}</td><td><input type=time onchange="upd('${ds}','st',this.value)" value="${r.st||''}"></td><td><input type=time onchange="upd('${ds}','en',this.value)" value="${r.en||''}"></td><td id=h_${ds}>0</td><td><input value="${r.loc||''}" onchange="upd('${ds}','loc',this.value)"></td><td><input class=small value="${r.n||''}" onchange="upd('${ds}','n',this.value)"></td><td><input class=small value="${r.loa||''}" onchange="upd('${ds}','loa',this.value)"></td><td id=r_${ds}>0</td><td id=o_${ds}>0</td></tr>`;}calc();}function upd(ds,k,v){db.days[ds]=db.days[ds]||{};db.days[ds][k]=v;save();calc()}function calc(){let total=0,reg=0,ot=0,loa=0,w='',wh=0;let rows=[...tb.rows];rows.forEach((tr,i)=>{let ds=tr.cells[0].innerText;let d=db.days[ds]||{};let h=0;if(d.st&&d.en){h=(new Date('2000-01-01 '+d.en)-new Date('2000-01-01 '+d.st))/3600000;if(h<0)h=0;}document.getElementById('h_'+ds).innerText=h.toFixed(1);total+=h;wh+=h;loa+=Number(d.loa||0);let day=new Date(ds).getDay();let ro=0,oo=0;if(day===0||i===rows.length-1){let wr=Math.min(44,wh),wo=Math.max(0,wh-44);w+='Week Total '+wh.toFixed(1)+' | Reg '+wr.toFixed(1)+' | OT '+wo.toFixed(1)+'<br>';wh=0;}ro=h;document.getElementById('r_'+ds).innerText=ro.toFixed(1);document.getElementById('o_'+ds).innerText=oo.toFixed(1);reg+=ro;});ot=Math.max(0,total-reg);document.getElementById('total').innerText=total.toFixed(1);document.getElementById('reg').innerText=reg.toFixed(1);document.getElementById('ot').innerText=ot.toFixed(1);document.getElementById('loat').innerText=loa.toFixed(0);weeks.innerHTML=w;save()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='bosch-v6-backup.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();refresh()};r.readAsText(f)}ensure();refresh();</script></body></html>

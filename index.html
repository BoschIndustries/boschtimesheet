<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V4</title><style>body{font-family:Arial,sans-serif;max-width:1200px;margin:auto;padding:20px}button{padding:8px 12px;margin:4px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px}.panel{border:1px solid #ccc;padding:10px;margin:10px 0}</style></head><body><h1>Bosch Timesheet V4</h1><div class="panel"><button onclick="newPeriod()">New Pay Period</button><select id="history" onchange="loadPeriod(this.value)"></select></div><div id="info"></div><table><thead><tr><th>Date</th><th>Hours</th></tr></thead><tbody id="rows"></tbody></table><div class="panel"><h3>Totals</h3><div id="totals"></div></div><script>const KEY='bosch_v4_db';let db=JSON.parse(localStorage.getItem(KEY)||'{"periods":{},"days":{}}');function save(){localStorage.setItem(KEY,JSON.stringify(db));}function periodId(d){return d;}function makePeriod(start){let s=new Date(start);let e=new Date(s);e.setMonth(e.getMonth()+1);e.setDate(20);let id=s.toISOString().slice(0,10);if(!db.periods[id])db.periods[id]={start:id};save();refresh();}function currentStart(){let n=new Date();let y=n.getFullYear(),m=n.getMonth();let s=(n.getDate()>=21)?new Date(y,m,21):new Date(y,m-1,21);return s.toISOString().slice(0,10);}function newPeriod(){let s=currentStart();makePeriod(s);}function refresh(){let h=document.getElementById('history');h.innerHTML='';Object.keys(db.periods).sort().reverse().forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;h.appendChild(o);});if(h.value)loadPeriod(h.value);}function loadPeriod(id){let start=new Date(id);let end=new Date(start.getFullYear(),start.getMonth()+1,20);document.getElementById('info').textContent='Pay Period: '+id+' to '+end.toISOString().slice(0,10);let tb=document.getElementById('rows');tb.innerHTML='';let total=0;for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){let ds=new Date(d).toISOString().slice(0,10);let tr=document.createElement('tr');let hrs=db.days[ds]||0;total+=Number(hrs);tr.innerHTML='<td>'+ds+'</td><td><input type=number step=0.5 value="'+hrs+'" onchange="setDay(''+ds+'',this.value)"></td>';tb.appendChild(tr);} document.getElementById('totals').textContent='Total Hours: '+total+' | Overtime calculated weekly across all saved dates (44+ hrs/week).';}window.setDay=function(ds,val){db.days[ds]=Number(val)||0;save();refresh();};if(Object.keys(db.periods).length===0)newPeriod();refresh();</script></body></html>

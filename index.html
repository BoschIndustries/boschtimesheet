<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V4</title><style>body{font-family:Arial,sans-serif;max-width:1200px;margin:auto;padding:15px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:center}input{width:70px}button,select{padding:8px;margin:4px}.card{border:1px solid #ccc;padding:10px;margin:10px 0}.totals{display:flex;gap:20px;flex-wrap:wrap}@media print{button,select{display:none}}</style></head><body><h1>Bosch Timesheet V4</h1><div class='card'><button onclick='createNextPeriod()'>New Pay Period</button><button onclick='exportData()'>Export Backup</button><input type='file' id='importFile' onchange='importData(event)'><br><label>History:</label><select id='periodSelect' onchange='loadPeriod(this.value)'></select></div><div id='periodInfo'></div><div class='totals'><div id='total'></div><div id='regular'></div><div id='ot'></div></div><table><thead><tr><th>Date</th><th>Hours</th><th>Regular</th><th>OT</th></tr></thead><tbody id='tbody'></tbody></table><script>
const KEY='boschV4';let db=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"periods":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function fmt(d){return d.toISOString().slice(0,10)}
function periodStart(date){let d=new Date(date);return d.getDate()>=21?new Date(d.getFullYear(),d.getMonth(),21):new Date(d.getFullYear(),d.getMonth()-1,21)}
function ensureCurrent(){let s=fmt(periodStart(new Date()));if(!db.periods.includes(s)){db.periods.push(s);db.periods.sort();save();}}
function createNextPeriod(){let last=db.periods[db.periods.length-1];let d=new Date(last);d.setMonth(d.getMonth()+1);d.setDate(21);db.periods.push(fmt(d));save();refresh();document.getElementById('periodSelect').value=fmt(d);loadPeriod(fmt(d));}
function weekStart(ds){let d=new Date(ds);let day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return fmt(d);}
function calcWeek(ws){let used=0,res={};for(let i=0;i<7;i++){let d=new Date(ws);d.setDate(d.getDate()+i);let ds=fmt(d);let h=Number(db.days[ds]||0);let reg=Math.max(0,Math.min(h,44-used));used+=h;let ot=Math.max(0,h-reg);res[ds]={reg,ot};}return res;}
function loadPeriod(start){let tb=document.getElementById('tbody');tb.innerHTML='';let s=new Date(start);let e=new Date(s.getFullYear(),s.getMonth()+1,20);document.getElementById('periodInfo').innerText='Pay Period: '+start+' to '+fmt(e);let total=0,regT=0,otT=0;for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){let ds=fmt(new Date(d));let wk=calcWeek(weekStart(ds))[ds]||{reg:0,ot:0};let h=Number(db.days[ds]||0);total+=h;regT+=wk.reg;otT+=wk.ot;let tr=document.createElement('tr');tr.innerHTML=`<td>${ds}</td><td><input type='number' step='0.5' value='${h}' onchange="setHours('${ds}',this.value)"></td><td>${wk.reg.toFixed(1)}</td><td>${wk.ot.toFixed(1)}</td>`;tb.appendChild(tr);}document.getElementById('total').innerText='Total: '+total.toFixed(1);document.getElementById('regular').innerText='Regular: '+regT.toFixed(1);document.getElementById('ot').innerText='OT: '+otT.toFixed(1);}
function setHours(ds,val){db.days[ds]=Number(val)||0;save();loadPeriod(document.getElementById('periodSelect').value);}
function refresh(){let s=document.getElementById('periodSelect');s.innerHTML='';db.periods.slice().reverse().forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;s.appendChild(o);});if(s.options.length){loadPeriod(s.value=s.options[0].value)}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='bosch-timesheet-backup.json';a.click();}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();refresh();};r.readAsText(f);}
ensureCurrent();refresh();
</script></body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosch Timesheet V3</title><style>body{font-family:Arial,sans-serif;margin:10px;background:#f4f4f4}.container{max-width:1200px;margin:auto;background:#fff;padding:10px;border:1px solid #000}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:3px;text-align:center}input[type=time]{width:90px}input[type=text],input[type=month]{width:100%;box-sizing:border-box}.summary{margin-top:10px;font-weight:bold}textarea{width:100%;height:70px}.weekbox{margin-top:10px;font-size:12px;background:#eee;padding:8px}@media print{@page{size:letter;margin:.15in}body{zoom:60%}button{display:none}}</style></head><body><div class="container"><h2>BOSCH INDUSTRIES LTD. TIME SHEET V3</h2><label>Pay Period Month (select the month containing the 21st):</label><input type="month" id="period" onchange="buildTable();saveData()"><div id="periodText"></div><table><thead><tr><th>Date</th><th>Start</th><th>End</th><th>Hours</th><th>Location</th><th>Nights</th><th>LOA</th></tr></thead><tbody id="rows"></tbody></table><div class="summary">Total Hours: <span id="total">0.00</span><br>Regular Hours: <span id="regular">0.00</span><br>Overtime Hours: <span id="ot">0.00</span></div><div class="weekbox" id="weeks"></div><h3>Notes / Reimbursements</h3><textarea id="notes" oninput="saveData()"></textarea><br><button onclick="window.print()">Print</button></div><script>function fmt(d){return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}function buildTable(){let p=document.getElementById('period').value;if(!p)return;let [y,m]=p.split('-').map(Number);let start=new Date(y,m-1,21);let end=new Date(y,m,20);document.getElementById('periodText').innerText='Period: '+start.toDateString()+' to '+end.toDateString();let rows='';let d=new Date(start);let i=0;while(d<=end){rows+=`<tr><td>${fmt(d)}</td><td><input type=time id=s${i} onchange='calc();saveData()'></td><td><input type=time id=e${i} onchange='calc();saveData()'></td><td id=h${i}>0.00</td><td><input type=text id=l${i} oninput='saveData()'></td><td><input type=text id=n${i} oninput='saveData()'></td><td><input type=text id=a${i} oninput='saveData()'></td></tr>`;d.setDate(d.getDate()+1);i++;}document.getElementById('rows').innerHTML=rows;restoreDayData();calc()}function calc(){let p=document.getElementById('period').value;if(!p)return;let [y,m]=p.split('-').map(Number);let start=new Date(y,m-1,21);let total=0,regular=0,ot=0;let weekHours=0;let weekly=[];for(let i=0;i<31;i++){let s=document.getElementById('s'+i);if(!s)break;let e=document.getElementById('e'+i);let hrs=0;if(s.value&&e.value){hrs=(new Date('2000-01-01 '+e.value)-new Date('2000-01-01 '+s.value))/3600000;if(hrs<0)hrs=0;}document.getElementById('h'+i).innerText=hrs.toFixed(2);total+=hrs;let cur=new Date(start);cur.setDate(start.getDate()+i);weekHours+=hrs;if(cur.getDay()==0||i==30){regular+=Math.min(44,weekHours);ot+=Math.max(0,weekHours-44);weekly.push('Week ending '+cur.toDateString()+': Regular '+Math.min(44,weekHours).toFixed(2)+' | OT '+Math.max(0,weekHours-44).toFixed(2));weekHours=0;}}document.getElementById('total').innerText=total.toFixed(2);document.getElementById('regular').innerText=regular.toFixed(2);document.getElementById('ot').innerText=ot.toFixed(2);document.getElementById('weeks').innerHTML=weekly.join('<br>');saveData()}function saveData(){let data={period:period.value,notes:notes.value};for(let i=0;i<31;i++){['s','e','l','n','a'].forEach(p=>{let el=document.getElementById(p+i);if(el)data[p+i]=el.value})}localStorage.setItem('boschV3',JSON.stringify(data));}function restoreDayData(){let d=JSON.parse(localStorage.getItem('boschV3')||'{}');for(let i=0;i<31;i++){['s','e','l','n','a'].forEach(p=>{let el=document.getElementById(p+i);if(el&&d[p+i])el.value=d[p+i];})}}window.onload=()=>{let d=JSON.parse(localStorage.getItem('boschV3')||'{}');if(d.period){period.value=d.period;buildTable();notes.value=d.notes||'';}else{let now=new Date();period.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');buildTable();}}</script></body></html>
